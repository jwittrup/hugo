[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.112.0"
  HUGO_ENABLEGITINFO = "true"

[context.production]
  command = "hugo --gc --minify"

[context.production.environment]
  HUGO_ENV = "production"

[context.branch-deploy]
  command = "hugo --gc --minify -F -b $DEPLOY_PRIME_URL"

[context.deploy-preview]
  command = "hugo --gc --minify -F -b $DEPLOY_PRIME_URL"

# Redirects
[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/"
  status = 301

# Google Analytics first-party proxy (bypasses ad blockers)
[[redirects]]
  from = "/ga/gtag.js"
  to = "https://www.googletagmanager.com/gtag/js"
  status = 200
  force = true

[[redirects]]
  from = "/ga/g/collect"
  to = "https://www.google-analytics.com/g/collect"
  status = 200
  force = true