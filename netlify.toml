[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.112.0"
  HUGO_ENABLEGITINFO = "true"

[context.production]
  command = "hugo --gc --minify"

[context.production.environment]
  HUGO_ENV = "production"

[context.branch-deploy]
  command = "hugo --gc --minify -F -b $DEPLOY_PRIME_URL"

[context.deploy-preview]
  command = "hugo --gc --minify -F -b $DEPLOY_PRIME_URL"

# Redirects
# Visitors from Denmark on the front page go to the Danish page by default.
# Choosing English sets the nf_country cookie, which overrides Netlify's
# geolocation (layouts/partials/lang-choice.html). 302, so browsers don't cache it.
[[redirects]]
  from = "/"
  to = "/da/"
  status = 302
  force = true
  conditions = {Country = ["DK"]}

[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
